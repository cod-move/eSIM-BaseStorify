<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="820" cy="170" r="260" fill="#fff" opacity=".07"/>
  <circle cx="140" cy="880" r="220" fill="#fff" opacity=".06"/>

  <!-- SIM card -->
  <g transform="translate(330 170)">
    <path d="M40 0h220l80 80v340a40 40 0 0 1-40 40H40a40 40 0 0 1-40-40V40A40 40 0 0 1 40 0z" fill="#fff"/>
    <rect x="70" y="120" width="200" height="170" rx="22" fill="url(#chip)"/>
    <path d="M70 177h200M70 233h200M137 120v170M203 120v170" stroke="#B45309" stroke-width="6" opacity=".55"/>
    <text x="170" y="385" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#6D28D9" letter-spacing="2">+1 ••• ••••</text>
