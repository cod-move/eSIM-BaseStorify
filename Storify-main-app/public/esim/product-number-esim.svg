    <path transform="translate(-54 -54) scale(4.5)" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="#fff"/>
  </g>

  <text x="500" y="790" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" fill="#fff">Phone Number eSIM</text>
  <text x="500" y="860" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="500" fill="#EDE9FE">Your own number for calls, SMS and data</text>
