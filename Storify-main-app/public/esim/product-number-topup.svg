<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="820" cy="170" r="260" fill="#fff" opacity=".07"/>
  <circle cx="140" cy="880" r="220" fill="#fff" opacity=".06"/>

  <!-- phone -->
  <g transform="translate(330 150)">
    <rect width="340" height="520" rx="54" fill="#fff"/>
    <rect x="26" y="70" width="288" height="380" rx="20" fill="#FFF1F2"/>
    <rect x="130" y="30" width="80" height="12" rx="6" fill="#FBCFE8"/>
    <circle cx="170" cy="488" r="16" fill="#FBCFE8"/>
    <!-- handset -->
    <path transform="translate(108 120) scale(5.2)" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="#DB2777"/>
    <text x="170" y="400" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#9D174D" letter-spacing="2">+1 ••• ••••</text>
  </g>

  <!-- top-up badge: plus credit -->
  <g transform="translate(660 600)">
    <circle r="105" fill="#10B981" stroke="#fff" stroke-width="12"/>
    <path d="M0 -50v100M-50 0h100" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
  </g>

  <text x="500" y="790" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" fill="#fff">Number Top-up</text>
  <text x="500" y="860" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="500" fill="#FFE4E6">Add credit or data to your number</text>
</svg>
