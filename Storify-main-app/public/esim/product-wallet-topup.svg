<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="820" cy="170" r="260" fill="#fff" opacity=".07"/>
  <circle cx="140" cy="880" r="220" fill="#fff" opacity=".06"/>

  <!-- coins behind wallet -->
  <g>
    <circle cx="560" cy="250" r="70" fill="#FBBF24" stroke="#fff" stroke-width="8"/>
    <text x="560" y="276" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" fill="#fff">$</text>
    <circle cx="430" cy="290" r="56" fill="#FCD34D" stroke="#fff" stroke-width="8"/>
  </g>

  <!-- wallet -->
  <g transform="translate(260 300)">
    <rect width="480" height="340" rx="44" fill="#fff"/>
    <rect y="0" width="480" height="80" rx="40" fill="#D1FAE5"/>
    <rect x="300" y="140" width="200" height="120" rx="30" fill="#ECFDF5" stroke="#0F766E" stroke-width="8"/>
    <circle cx="360" cy="200" r="20" fill="#0F766E"/>
  </g>

  <!-- badge: plus -->
  <g transform="translate(690 600)">
    <circle r="95" fill="#F59E0B" stroke="#fff" stroke-width="12"/>
    <path d="M0 -45v90M-45 0h90" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
  </g>

  <text x="500" y="790" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" fill="#fff">Wallet Top-up</text>
  <text x="500" y="860" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="500" fill="#D1FAE5">Add balance for faster checkout</text>
</svg>
