<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      The launch screen: drawn with the page, before any script or stylesheet has
      loaded, so the app never shows itself half laid out. It is the app's own mark
      (launch-icon.png and launch-wordmark.png, copies of assets/images/splash-icon.png
      and splash-wordmark.png) on the splash screen's colour (app.json). The app writes
      its version in and fades it away once its first screen is ready
      (src/components/shell/launch-cover.tsx).
    -->
    <style id="launch-style">
      #launch {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #2f2f2f;
        transition: opacity 420ms cubic-bezier(0.33, 1, 0.68, 1);
      }
      #launch.leaving {
        opacity: 0;
        pointer-events: none;
      }
      #launch .launch-mark {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: transform 420ms cubic-bezier(0.33, 1, 0.68, 1);
      }
      #launch.leaving .launch-mark {
        transform: scale(1.08);
      }
      #launch-icon {
        width: 140px;
        height: 140px;
        animation: launch-breathe 1.8s ease-in-out infinite;
      }
      #launch-wordmark {
        position: absolute;
        top: calc(50% + 70px + 14px);
        width: 136px;
        height: auto;
      }
      #launch-version {
        position: absolute;
        bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        width: 100%;
        text-align: center;
        font:
          400 13px/18px system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: rgba(255, 255, 255, 0.7);
      }
      @keyframes launch-breathe {
        50% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-icon {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="launch" role="progressbar" aria-busy="true" aria-label="Loading">
      <div class="launch-mark">
        <img id="launch-icon" src="/launch-icon.png" alt="" />
        <img id="launch-wordmark" src="/launch-wordmark.png" alt="" />
      </div>
      <div id="launch-version"></div>
    </div>
  </body>
</html>
